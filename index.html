<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mappa Interattiva - Roma Barocca</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Lora (Elegante) e Outfit (Moderno) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    :root {
      --bg-warm: #FAF9F6; /* Off-white molto caldo */
      --text-dark: #2C2A29;
      --accent: #8E3A3A; /* Rosso mattone elegante */
    }

    body { 
      font-family: 'Outfit', sans-serif; 
      background-color: var(--bg-warm); 
      color: var(--text-dark);
    }
    
    .font-serif-custom { font-family: 'Lora', serif; }

    #map { height: 100vh; width: 100%; z-index: 1; }
    
    /* Filtro Mappa: Elegante, desaturata ma con una nota di colore caldo */
    .leaflet-tile-pane {
        filter: saturate(40%) contrast(105%) sepia(20%) brightness(102%);
    }

    /* --- STILE POPUP ELEGANTE --- */
    .leaflet-popup-content-wrapper {
      background: var(--bg-warm) !important;
      color: var(--text-dark) !important;
      border-radius: 12px !important;
      padding: 0 !important;
      box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.2) !important;
      border: 1px solid #E8E5E1;
      overflow: hidden;
    }
    .leaflet-popup-content { margin: 0 !important; width: 340px !important; }
    .leaflet-popup-tip { background: var(--bg-warm) !important; }

    /* Pulsante X */
    .leaflet-container a.leaflet-popup-close-button {
      color: #999 !important;
      top: 15px !important;
      right: 15px !important;
      font-size: 20px !important;
      transition: color 0.3s !important;
    }
    .leaflet-container a.leaflet-popup-close-button:hover { color: var(--accent) !important; background: transparent !important; }

    /* --- PIN A GOCCIA ELEGANTE --- */
    .elegant-pin-container {
      width: 32px;
      height: 32px;
      position: relative;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .elegant-pin-container:hover { transform: scale(1.15) translateY(-5px); z-index: 1000 !important; }
    
    .elegant-pin {
      width: 100%;
      height: 100%;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      border: 1.5px solid #ffffff;
      box-shadow: -3px 3px 6px rgba(0,0,0,0.25);
    }
    .elegant-pin-dot {
      width: 10px;
      height: 10px;
      background: #ffffff;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
    }

    /* Scrollbar minimal */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #E0DCD6; }
    ::-webkit-scrollbar-thumb:hover { background: #C2BCB3; }
  </style>
</head>
<body class="flex flex-col md:flex-row h-screen overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-full md:w-[400px] border-r border-[#E8E5E1] flex flex-col h-2/5 md:h-full z-10 shadow-2xl relative" style="background-color: var(--bg-warm);">
    
    <!-- Header -->
    <header class="pt-10 pb-6 px-8 relative">
      <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-[#8E3A3A] to-[#D4A373]"></div>
      <h1 class="text-4xl font-serif-custom text-[#2C2A29] tracking-tight mb-2">Roma Barocca</h1>
      <p class="text-xs font-semibold uppercase tracking-[0.2em] text-[#8E3A3A]">Itinerario d'Arte</p>
    </header>

    <!-- Lista Opere Divisa per Autore -->
    <div id="art-list" class="flex-1 overflow-y-auto px-6 pb-8">
      <!-- Generato dinamicamente in JS -->
    </div>

  </aside>

  <!-- Mappa -->
  <main class="flex-1 relative h-3/5 md:h-full bg-[#E8E5E1]">
    <div id="map"></div>
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    const baseUrl = "https://andreascalisi2009.github.io/mappa-opere-barocco/";

    // Dati aggiornati: Aggiunto l'Autore e l'estensione MP4 in MAIUSCOLO per San Pietro (che fissa il video!)
    const artworksData = [
      { id: 1, author: "Anonimo Paleocristiano", title: "San Pancrazio", slug: "san-pancrazio", extension: "mp4", location: "Basilica di San Pancrazio", group: "Gruppo 1", students: "Marco, Sofia, Luca", coords: [41.8858, 12.4593], description: "Basilica paleocristiana sul colle Gianicolo.", color: "#596C68" }, 
      { id: 2, author: "Caravaggio", title: "San Matteo", slug: "san-matteo", extension: "mp4", location: "San Luigi dei Francesi", group: "Gruppo 2", students: "Elena, Matteo, Giulia", coords: [41.8996, 12.4746], description: "Ciclo pittorico dedicato a San Matteo nella Cappella Contarelli.", color: "#8E3A3A" }, 
      { id: 3, author: "Andrea Pozzo", title: "Gloria di Sant'Ignazio", slug: "gloria-di-sant-ignazio-e-finta-cupola", extension: "mp4", location: "Chiesa di Sant'Ignazio", group: "Gruppo 3", students: "Andrea, Francesca, Tommaso", coords: [41.8992, 12.4798], description: "Illusione prospettica e spettacolare affresco a trompe-l'œil.", color: "#4A6274" }, 
      { id: 4, author: "Caravaggio", title: "Giuditta e Oloferne", slug: "giuditta-che-decapita-oloferne", extension: "mp4", location: "Palazzo Barberini", group: "Gruppo 4", students: "Lorenzo, Chiara, Davide", coords: [41.9034, 12.4903], description: "Uno dei dipinti più drammatici, conservato a Palazzo Barberini.", color: "#8E3A3A" }, 
      { id: 5, author: "Gian Lorenzo Bernini", title: "Colonnato di San Pietro", slug: "colonnato-di-san-pietro", extension: "MP4", location: "Piazza San Pietro", group: "Gruppo 5", students: "Sara, Alessandro, Beatrice", coords: [41.9022, 12.4568], description: "L'abbraccio monumentale progettato per accogliere i fedeli in Vaticano.", color: "#D4A373" }, 
      { id: 6, author: "Gian Lorenzo Bernini", title: "Baldacchino di San Pietro", slug: "baldacchino-di-san-pietro-e-cattedra-di-san-pietro", extension: "mp4", location: "Basilica di San Pietro", group: "Gruppo 6", students: "Gabriele, Martina, Filippo", coords: [41.9021, 12.4539], description: "Monumentale struttura bronzea e scenografica.", color: "#D4A373" }, 
      { id: 7, author: "Pietro da Cortona", title: "Trionfo della Provvidenza", slug: "trionfo-della-divina-provvidenza", extension: "mp4", location: "Palazzo Barberini", group: "Gruppo 7", students: "Edoardo, Alice, Giovanni", coords: [41.9032, 12.4901], description: "Maestoso affresco del soffitto del Salone Grande.", color: "#A88C6B" }, 
      { id: 8, author: "Gian Lorenzo Bernini", title: "Estasi di Santa Teresa", slug: "estasi-di-santa-teresa", extension: "mp4", location: "Santa Maria della Vittoria", group: "Gruppo 8", students: "Federico, Camilla, Riccardo", coords: [41.9047, 12.4942], description: "Capolavoro marmoreo della scultura barocca.", color: "#D4A373" }, 
      { id: 9, author: "Francesco Borromini", title: "San Carlo alle 4 Fontane", slug: "san-carlo-alle-quattro-fontane", extension: "mp4", location: "Chiesa di San Carlino", group: "Gruppo 9", students: "Giorgia, Leonardo, Elisa", coords: [41.9018, 12.4907], description: "Geniale chiesa dalle linee concave e convesse.", color: "#746C53" }
    ];

    const map = L.map('map', { zoomControl: false }).setView([41.901, 12.478], 14);
    L.control.zoom({ position: 'topright' }).addTo(map);

    // Mappa Base OpenStreetMap con CSS Filter Applicato (Non richiede API KEY)
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const markers = {};
    const artListEl = document.getElementById('art-list');

    // Raggruppamento delle opere per Autore
    const groupedData = artworksData.reduce((acc, curr) => {
        if (!acc[curr.author]) acc[curr.author] = [];
        acc[curr.author].push(curr);
        return acc;
    }, {});

    // Generazione della Sidebar Divisa per Autore
    Object.keys(groupedData).forEach(author => {
        // Intestazione Autore
        const authorHeader = document.createElement('div');
        authorHeader.className = "mt-6 mb-3 border-b border-[#E8E5E1] pb-1";
        authorHeader.innerHTML = `<h2 class="text-[11px] font-bold uppercase tracking-[0.15em] text-[#A69F98]">${author}</h2>`;
        artListEl.appendChild(authorHeader);

        // Opere di questo Autore
        groupedData[author].forEach(item => {
            const videoFullUrl = `${baseUrl}${item.slug}.${item.extension}`;

            const card = document.createElement('div');
            card.className = "group py-3 px-2 hover:bg-[#F2EFE9] rounded-lg cursor-pointer transition-all duration-300 mb-1 border border-transparent hover:border-[#E8E5E1]";
            card.innerHTML = `
              <div class="flex gap-4 items-center">
                <div class="w-1.5 h-1.5 rounded-full" style="background-color: ${item.color};"></div>
                <div>
                  <h3 class="font-serif-custom text-[17px] text-[#2C2A29] leading-tight group-hover:text-[#8E3A3A] transition-colors">${item.title}</h3>
                  <p class="text-[11px] text-[#8C8782] mt-0.5 tracking-wide">${item.location}</p>
                </div>
              </div>
            `;

            card.addEventListener('click', () => {
              map.flyTo(item.coords, 16, { duration: 1.2 });
              markers[item.id].openPopup();
            });

            artListEl.appendChild(card);

            // Popup Mappa Editoriale
            const popupContent = `
              <div class="p-6">
                <p class="text-[10px] font-bold uppercase tracking-[0.2em] mb-2" style="color: ${item.color};">${author}</p>
                <h3 class="font-serif-custom text-xl text-[#2C2A29] leading-tight mb-1">${item.title}</h3>
                <p class="text-[12px] text-[#8C8782] mb-4">${item.location}</p>
                
                <p class="text-[13px] text-[#555] leading-relaxed mb-5 border-l-2 pl-3" style="border-color: ${item.color};">
                  ${item.description}
                  <br><span class="text-[10px] italic text-[#A69F98] mt-2 block">Presentato da: ${item.students} (${item.group})</span>
                </p>

                <div class="relative aspect-video w-full rounded-md overflow-hidden bg-[#1A1A1A] shadow-inner mb-3">
                  <!-- Tag Video forzato a type="video/mp4" a prescindere dall'estensione maiuscola/minuscola -->
                  <video class="w-full h-full object-cover" controls playsinline preload="metadata">
                    <source src="${videoFullUrl}" type="video/mp4">
                    Il browser non supporta il riproduttore.
                  </video>
                </div>
              </div>
            `;

            // Marker a Goccia Elegante
            const customElegantIcon = L.divIcon({
              className: 'custom-leaflet-icon',
              html: `
                <div class="elegant-pin-container">
                  <div class="elegant-pin" style="background-color: ${item.color};"></div>
                  <div class="elegant-pin-dot"></div>
                </div>
              `,
              iconSize: [32, 32],
              iconAnchor: [16, 32],
              popupAnchor: [0, -32]
            });

            const marker = L.marker(item.coords, { icon: customElegantIcon }).addTo(map);
            marker.bindPopup(popupContent);
            markers[item.id] = marker;
        });
    });
  </script>
</body>
</html>
