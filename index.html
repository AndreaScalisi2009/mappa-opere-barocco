<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>v5.0 - Mappa Interattiva - Roma Barocca & Rococo</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Lora e Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    :root {
      --bg-warm: #FAF9F6;
      --text-dark: #2C2A29;
    }

    body { 
      font-family: 'Outfit', sans-serif; 
      background-color: var(--bg-warm); 
      color: var(--text-dark);
    }
    
    .font-serif-custom { font-family: 'Lora', serif; }

    #map { height: 100vh; width: 100%; z-index: 1; }
    
    /* Filtro Mappa Caldo ed Elegante */
    .leaflet-tile-pane {
        filter: saturate(45%) contrast(105%) sepia(25%) brightness(101%);
    }

    /* --- STILE POPUP --- */
    .leaflet-popup-content-wrapper {
      background: var(--bg-warm) !important;
      color: var(--text-dark) !important;
      border-radius: 12px !important;
      padding: 0 !important;
      box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.2) !important;
      border: 1px solid #E8E5E1;
      overflow: hidden;
    }
    .leaflet-popup-content { margin: 0 !important; width: 350px !important; }
    .leaflet-popup-tip { background: var(--bg-warm) !important; }

    /* Pulsante X */
    .leaflet-container a.leaflet-popup-close-button {
      color: #999 !important;
      top: 15px !important;
      right: 15px !important;
      font-size: 20px !important;
      transition: color 0.3s !important;
    }
    .leaflet-container a.leaflet-popup-close-button:hover { color: #8E3A3A !important; background: transparent !important; }

    /* --- PIN A GOCCIA --- */
    .elegant-pin-container {
      width: 32px;
      height: 32px;
      position: relative;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .elegant-pin-container:hover { transform: scale(1.15) translateY(-5px); z-index: 1000 !important; }
    
    .elegant-pin {
      width: 100%;
      height: 100%;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      border: 1.5px solid #ffffff;
      box-shadow: -3px 3px 6px rgba(0,0,0,0.25);
    }
    .elegant-pin-dot {
      width: 10px;
      height: 10px;
      background: #ffffff;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #E0DCD6; }
    ::-webkit-scrollbar-thumb:hover { background: #C2BCB3; }
  </style>
</head>
<body class="flex flex-col md:flex-row h-screen overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-full md:w-[420px] border-r border-[#E8E5E1] flex flex-col h-2/5 md:h-full z-10 shadow-2xl relative" style="background-color: var(--bg-warm);">
    
    <!-- Header -->
    <header class="pt-8 pb-5 px-8 relative border-b border-[#E8E5E1]">
      <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-[#8E3A3A] to-[#D4A373]"></div>
      <div class="flex justify-between items-start">
        <div>
          <h1 class="text-3xl font-serif-custom text-[#2C2A29] tracking-tight mb-1">Roma Barocca</h1>
          <p class="text-[11px] font-semibold uppercase tracking-[0.2em] text-[#8E3A3A]">Classe 4G • 10/2026</p>
        </div>
        <span class="text-[10px] font-mono bg-[#E8E5E1] text-[#666] px-2 py-1 rounded">v5.0</span>
      </div>
    </header>

    <!-- Lista Opere Divisa per Autore -->
    <div id="art-list" class="flex-1 overflow-y-auto px-6 py-4">
      <!-- Generato dinamicamente -->
    </div>

  </aside>

  <!-- Mappa -->
  <main class="flex-1 relative h-3/5 md:h-full bg-[#E8E5E1]">
    <div id="map"></div>
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    const baseUrl = "https://andreascalisi2009.github.io/mappa-opere-barocco/";

    // Opere estratte ed verificate dalla tabella ufficiale fornita
    const artworksData = [
      { 
        id: 1,

        location: "Chiesa di San Luigi dei Francesi (Cappella Contarelli)",

        coords: [41.8996, 12.4746],

        color: "#8E3A3A"

      {

        author: "Caravaggio",

        extension: "mp4", 
        location: "Chiesa di Santa Maria del Popolo (Cappella Cerasi)", 
        group: "Gruppo 2", 
        students: "Studenti Gruppo 2", 
        coords: [41.9106, 12.4761], 
        description: "Straordinari dipinti visibili nella Cappella Cerasi, vicini ai capolavori di Carracci.", 
        color: "#8E3A3A" 
      },
      { 
        id: 3, 
        author: "Caravaggio", 
        title: "Opere alla Galleria Borghese", 
        slug: "fanciullo-canestra-frutta", 
        extension: "mp4", 
        location: "Galleria Borghese", 
        group: "Gruppo 2", 
        students: "Studenti Gruppo 2", 
        coords: [41.9142, 12.4922], 
        description: "Collezione comprendente Fanciullo con canestra di frutta, Bacchino malato e Davide con la testa di Golia.", 
        color: "#8E3A3A" 
      },
      { 
        id: 4, 
        author: "Gian Lorenzo Bernini", 
        title: "Estasi di Santa Teresa", 
        slug: "estasi-di-santa-teresa", 
        extension: "mp4", 
        location: "Chiesa di Santa Maria della Vittoria (Cappella Cornaro)", 
        group: "Gruppo 8", 
        students: "Federico, Camilla, Riccardo", 
        coords: [41.9047, 12.4942], 
        description: "Capolavoro scultoreo; attenzione a spiegare bene anche i palchetti con i rilievi della famiglia Cornaro.", 
        color: "#B46A36" 
      },
      { 
        id: 5, 
        author: "Gian Lorenzo Bernini", 
        title: "Capolavori alla Galleria Borghese", 
        slug: "apollo-e-dafne", 
        extension: "mp4", 
        location: "Galleria Borghese", 
        group: "Gruppo 8", 
        students: "Studenti Bernini", 
        coords: [41.9142, 12.4922], 
        description: "Gruppi scultorei monumentali: Apollo e Dafne, Il Ratto di Proserpina e il David.", 
        color: "#B46A36" 
      },
      { 
        id: 6, 
        author: "Gian Lorenzo Bernini", 
        title: "Baldacchino e Cattedra di San Pietro", 
        slug: "baldacchino-di-san-pietro-e-cattedra-di-san-pietro", 
        extension: "mp4", 
        location: "Basilica di San Pietro", 
        group: "Gruppo 6", 
        students: "Gabriele, Martina, Filippo", 
        coords: [41.9021, 12.4539], 
        description: "Imponenti strutture bronzee e scenografiche all'interno della Basilica Vaticana.", 
        color: "#B46A36" 
      },
      { 
        id: 7, 
        author: "Gian Lorenzo Bernini", 
        title: "Colonnato di San Pietro", 
        slug: "colonnato-di-san-pietro", 
        extension: "MP4", 
        location: "Piazza San Pietro", 
        group: "Gruppo 5", 
        students: "Sara, Alessandro, Beatrice", 
        coords: [41.9022, 12.4568], 
        description: "Il monumentale abbraccio architettonico progettato per accogliere i fedeli.", 
        color: "#B46A36" 
      },
      { 
        id: 8, 
        author: "Gian Lorenzo Bernini", 
        title: "Sant'Andrea al Quirinale", 
        slug: "sant-andrea-al-quirinale", 
        extension: "mp4", 
        location: "Via del Quirinale 30", 
        group: "Gruppo 5", 
        students: "Studenti Gruppo 5", 
        coords: [41.9009, 12.4912], 
        description: "Chiesa gioiello del barocco romano caratterizzata dalla pianta ellittica trasversale.", 
        color: "#B46A36" 
      },
      { 
        id: 9, 
        author: "Gian Lorenzo Bernini", 
        title: "Fontana dei Quattro Fiumi & del Tritone", 
        slug: "fontana-dei-quattro-fiumi", 
        extension: "mp4", 
        location: "Piazza Navona / Piazza Barberini", 
        group: "Gruppo 5", 
        students: "Studenti Bernini", 
        coords: [41.8992, 12.4731], 
        description: "Celebri fontane monumentali simbolo della Roma barocca all'aperto.", 
        color: "#B46A36" 
      },
      { 
        id: 10, 
        author: "Francesco Borromini", 
        title: "San Carlo alle Quattro Fontane (San Carlino)", 
        slug: "san-carlo-alle-quattro-fontane", 
        extension: "mp4", 
        location: "Via del Quirinale 23", 
        group: "Gruppo 9", 
        students: "Giorgia, Leonardo, Elisa", 
        coords: [41.9018, 12.4907], description: "Geniale chiesa e chiostro dalle linee concave e convesse e cripta nascosta.", 
        color: "#3B5A69" 
      },
      { 
        id: 11, 
        author: "Francesco Borromini", 
        title: "Sant'Ivo alla Sapienza", 
        slug: "sant-ivo-alla-sapienza", 
        extension: "mp4", 
        location: "Corso del Rinascimento 40", 
        group: "Gruppo 9", 
        students: "Studenti Borromini", 
        coords: [41.8973, 12.4741], 
        description: "Capolavoro geometrico con la celebre lanterna a spirale nel cortile dell'Archivio di Stato.", 
        color: "#3B5A69" 
      },
      { 
        id: 12, 
        author: "Pietro da Cortona", 
        title: "Trionfo della Divina Provvidenza", 
        slug: "trionfo-della-divina-provvidenza", 
        extension: "mp4", 
        location: "Palazzo Barberini", 
        group: "Gruppo 7", 
        students: "Edoardo, Alice, Giovanni", 
        coords: [41.9032, 12.4901], 
        description: "Maestoso affresco della volta del Salone Grande e confronto con le scale di Bernini e Borromini.", 
        color: "#5C6B48" 
      },
      { 
        id: 13, 
        author: "Pietro da Cortona", 
        title: "Chiesa di Santa Maria della Pace e Santi Luca e Martina", 
        slug: "santa-maria-della-pace", 
        extension: "mp4", 
        location: "Vicolo dell'Arco della Pace 5 / Fori Romani", 
        group: "Gruppo 7", 
        students: "Studenti Gruppo 7", 
        coords: [41.8992, 12.4712], 
        description: "Facciate monumentali e quinte teatrali barocche nel tessuto urbano.", 
        color: "#5C6B48" 
      },
      { 
        id: 14, 
        author: "Artemisia Gentileschi & Caravaggio", 
        title: "Giuditta che decapita Oloferne", 
        slug: "giuditta-che-decapita-oloferne", 
        extension: "mp4", 
        location: "Palazzo Barberini", 
        group: "Gruppo 4", 
        students: "Lorenzo, Chiara, Davide", 
        coords: [41.9034, 12.4903], 
        description: "Confronto sulla violenza drammatica e la luce caravaggesca.", 
        color: "#7A4360" 
      },
      { 
        id: 15, 
        author: "Plautilla Bricci", 
        title: "Cappella di San Luigi & Villa Benedetta (Il Vascello)", 
        slug: "san-pancrazio", 
        extension: "mp4", 
        location: "San Luigi dei Francesi / Via delle Mura Gianicolensi", 
        group: "Gruppo 1", 
        students: "Marco, Sofia, Luca", 
        coords: [41.8858, 12.4593], 
        description: "Opere della prima donna architetto d'Europa e resti barocchi nei pressi di Porta San Pancrazio.", 
        color: "#7D6B4E" 
      },
      { 
        id: 16, 
        author: "Filippo Raguzzini", 
        title: "Piazza di Sant'Ignazio", 
        slug: "piazza-sant-ignazio", 
        extension: "mp4", 
        location: "Piazza di Sant'Ignazio", 
        group: "Gruppo 3", 
        students: "Studenti Raguzzini", 
        coords: [41.8992, 12.4798], 
        description: "Scenografico complesso di palazzine per appartamenti a pianta curvilinea.", 
        color: "#8B5A2B" 
      },
      { 
        id: 17, 
        author: "Padre Andrea Pozzo", 
        title: "Gloria di Sant'Ignazio e Finta Cupola", 
        slug: "gloria-di-sant-ignazio-e-finta-cupola", 
        extension: "mp4", 
        location: "Chiesa di Sant'Ignazio di Loyola", 
        group: "Gruppo 3", 
        students: "Andrea, Francesca, Tommaso", 
        coords: [41.8992, 12.4798], 
        description: "Capolavori di prospettiva e trompe-l'œil; osservare il punto esatto del pavimento.", 
        color: "#8B5A2B" 
      }
    ];

    const map = L.map('map', { zoomControl: false }).setView([41.901, 12.478], 14);
    L.control.zoom({ position: 'topright' }).addTo(map);

    // Tile Layer OpenStreetMap con filtri CSS caldi
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const markers = {};
    const artListEl = document.getElementById('art-list');

    // Raggruppamento per Autore
    const groupedData = artworksData.reduce((acc, curr) => {
        if (!acc[curr.author]) acc[curr.author] = [];
        acc[curr.author].push(curr);
        return acc;
    }, {});

    // Generazione della Sidebar con il nome dell'autore colorato
    Object.keys(groupedData).forEach(author => {
        const sampleColor = groupedData[author][0].color;

        const authorHeader = document.createElement('div');
        authorHeader.className = "mt-6 mb-2 border-b border-[#E8E5E1] pb-1";
        // Il nome dell'autore assume direttamente il colore tematico della sua categoria
        authorHeader.innerHTML = `<h2 class="text-[12px] font-bold uppercase tracking-[0.15em]" style="color: ${sampleColor};">${author}</h2>`;
        artListEl.appendChild(authorHeader);

        groupedData[author].forEach(item => {
            const videoFullUrl = `${baseUrl}${item.slug}.${item.extension}`;

            const card = document.createElement('div');
            card.className = "group py-2.5 px-2 hover:bg-[#F2EFE9] rounded-lg cursor-pointer transition-all duration-300 mb-1 border border-transparent hover:border-[#E8E5E1]";
            card.innerHTML = `
              <div>
                <h3 class="font-serif-custom text-[16px] text-[#2C2A29] leading-tight group-hover:text-[#8E3A3A] transition-colors">${item.title}</h3>
                <p class="text-[11px] text-[#8C8782] mt-0.5 tracking-wide">${item.location}</p>
              </div>
            `;

            card.addEventListener('click', () => {
              map.flyTo(item.coords, 16, { duration: 1.2 });
              markers[item.id].openPopup();
            });

            artListEl.appendChild(card);

            // Popup Mappa con supporto Fullscreen automatico sul video
            const popupContent = `
              <div class="p-5">
                <p class="text-[10px] font-bold uppercase tracking-[0.2em] mb-1" style="color: ${item.color};">${author}</p>
                <h3 class="font-serif-custom text-lg text-[#2C2A29] leading-tight mb-1">${item.title}</h3>
                <p class="text-[11px] text-[#8C8782] mb-3">${item.location}</p>
                
                <p class="text-[12px] text-[#555] leading-relaxed mb-4 border-l-2 pl-3" style="border-color: ${item.color};">
                  ${item.description}
                  <br><span class="text-[10px] italic text-[#8C8782] mt-1.5 block">Presentato da: ${item.students} (${item.group})</span>
                </p>

                <div class="relative aspect-video w-full rounded-md overflow-hidden bg-[#1A1A1A] shadow-inner mb-2">
                  <video id="vid-${item.id}" class="w-full h-full object-cover" controls playsinline preload="metadata">
                    <source src="${videoFullUrl}" type="video/mp4">
                    Il browser non supporta il riproduttore.
                  </video>
                </div>
                <div class="flex justify-between items-center text-[10px]">
                  <button onclick="openFullscreen('vid-${item.id}')" class="text-[#8E3A3A] font-semibold hover:underline">
                    <i class="fa-solid fa-expand mr-1"></i>Apri video a schermo intero
                  </button>
                  <a href="${videoFullUrl}" target="_blank" class="text-[#666] hover:underline">
                    Scheda Esterna &rarr;
                  </a>
                </div>
              </div>
            `;

            const customElegantIcon = L.divIcon({
              className: 'custom-leaflet-icon',
              html: `
                <div class="elegant-pin-container">
                  <div class="elegant-pin" style="background-color: ${item.color};"></div>
                  <div class="elegant-pin-dot"></div>
                </div>
              `,
              iconSize: [32, 32],
              iconAnchor: [16, 32],
              popupAnchor: [0, -32]
            });

            const marker = L.marker(item.coords, { icon: customElegantIcon }).addTo(map);
            marker.bindPopup(popupContent);
            markers[item.id] = marker;
        });
    });

    // Funzione globale per portare il video in Fullscreen al click
    function openFullscreen(videoId) {
      const videoElement = document.getElementById(videoId);
      if (videoElement) {
        if (videoElement.requestFullscreen) {
          videoElement.requestFullscreen();
        } else if (videoElement.webkitRequestFullscreen) { /* Safari */
          videoElement.webkitRequestFullscreen();
        } else if (videoElement.msRequestFullscreen) { /* IE11 */
          videoElement.msRequestFullscreen();
        }
        videoElement.play();
      }
    }
  </script>
</body>
</html>
